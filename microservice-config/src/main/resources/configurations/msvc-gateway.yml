eureka:
  client:
    register-with-eureka: false

server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: students
          uri: lb://microservice-student
          predicates:
            - Path=/api/students/**
        - id: courses
          uri: lb://microservice-course
          predicates:
            - Path= /api/courses/**

